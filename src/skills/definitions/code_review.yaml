name: code_review
description: "审查代码质量和潜在问题"
required_tools:
  - read_file
  - lint_code
  - search_knowledge
steps:
  - id: read_code
    type: tool_call
    tool: read_file
    params:
      path: "{{ input.file_path }}"
    output: code_content

  - id: lint
    type: tool_call
    tool: lint_code
    params:
      code: "{{ code_content }}"
      language: "{{ input.language }}"
    output: diagnostics

  - id: analyze
    type: llm_reasoning
    prompt: |
      你是代码审查专家。以下是代码和静态分析结果：
      ```
      {{ code_content }}
      ```
      静态分析: {{ diagnostics }}

      请从以下维度审查：
      1. 代码正确性
      2. 性能问题
      3. 安全隐患
      4. 可维护性

      输出 JSON 格式的审查报告。
    output: review_report

  - id: check_best_practices
    type: tool_call
    tool: search_knowledge
    params:
      query: "{{ input.language }} best practices for the patterns used in this code"
      top_k: 3
    output: best_practices

  - id: final_report
    type: llm_reasoning
    prompt: |
      结合审查报告和最佳实践，生成最终审查意见：
      审查报告: {{ review_report }}
      最佳实践参考: {{ best_practices }}
    output: final_review
