name: data_analysis
description: "对数据集进行探索性分析，生成报告"
required_tools:
  - csv_to_dict
  - run_python
  - write_file
steps:
  - id: parse_data
    type: tool_call
    tool: csv_to_dict
    params:
      csv_text: "{{ input.csv_content }}"
    output: parsed_data

  - id: analyze
    type: llm_reasoning
    prompt: |
      你是一个数据分析师。请分析以下数据并生成 Python 代码来执行探索性分析：
      数据样本（前5行）: {{ parsed_data }}
      分析目标: {{ input.analysis_goal }}

      生成的代码应该：
      1. 计算基本统计量
      2. 识别趋势和异常
      3. 输出分析结果为 JSON 格式

      只输出 Python 代码，不要其他内容。
    output: analysis_code

  - id: execute_analysis
    type: tool_call
    tool: run_python
    params:
      code: "{{ analysis_code }}"
      timeout: 60
    output: analysis_result

  - id: generate_report
    type: llm_reasoning
    prompt: |
      基于数据分析结果，生成一份结构化的分析报告：
      分析结果: {{ analysis_result }}
      原始目标: {{ input.analysis_goal }}

      报告应包含：摘要、关键发现、数据趋势、建议。
    output: report

  - id: save_report
    type: tool_call
    tool: write_file
    params:
      path: "{{ input.output_path }}"
      content: "{{ report }}"
    output: save_result
