system:
  name: "Multi-Agent System"
  version: "0.1.0"
  log_level: INFO

llm:
  # DeepSeek 使用 OpenAI 兼容协议，provider 保持 openai，
  # 由 base_url 指向 DeepSeek 端点（见 src/llm/langchain_llm.py 的 openai 分支）
  provider: openai
  model: deepseek-v4-flash
  api_key: ${DEEPSEEK_API_KEY}
  base_url: https://api.deepseek.com/v1
  temperature: 0.5
  max_tokens: 2048
  timeout: 60

embedding:
  # 硅基流动（SiliconFlow）的 OpenAI 兼容 embedding 接口。
  # 注意：换模型等于换向量空间，已灌入的向量库必须重建。
  model: BAAI/bge-m3
  dimensions: 1024
  device: api
  batch_size: 32
  api_key: ${SILICONFLOW_API_KEY}
  base_url: https://api.siliconflow.cn/v1

vector_store:
  backend: chroma
  persist_dir: ./data/chroma
  collection: default

rag:
  chunk_size: 512
  chunk_overlap: 64
  retrieval_top_k: 5
  rerank: true
  rerank_model: qwen3-omni-flash

agents:
  max_concurrent: 5
  default_strategy: react
  memory:
    short_term_max: 20
    long_term_backend: sqlite

mcp:
  servers:
    - name: filesystem
      enabled: true
      root_dir: ./data/workspace
    - name: database
      enabled: false
      connection_string: ${DB_URL}
    - name: web
      enabled: true
      allowed_domains: ["*"]
